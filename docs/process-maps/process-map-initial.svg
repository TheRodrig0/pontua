<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760"
  preserveAspectRatio="xMidYMid meet"
  style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif; text-rendering: geometricPrecision; shape-rendering: geometricPrecision;">
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    }

    .pool-title {
      font-weight: bold;
      fill: #000000;
      letter-spacing: 1px;
      font-size: 16px;
    }

    .lane-label {
      font-weight: bold;
      fill: #000000;
      font-size: 15px;
    }

    .task-title {
      font-weight: 600;
      font-size: 14.5px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .gw-label {
      font-weight: bold;
      font-size: 14px;
      fill: #000000;
      text-anchor: middle;
    }

    .cond-label {
      font-weight: bold;
      font-size: 13.5px;
      fill: #000000;
    }

    .event-label {
      font-weight: bold;
      font-size: 14px;
      fill: #000000;
      text-anchor: middle;
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" stroke="#000000" stroke-width="0.5" />
    </marker>
  </defs>

  <!-- Fundo Branco -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Pool Principal -->
  <rect x="20" y="20" width="1140" height="720" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <rect x="20" y="20" width="44" height="720" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="-380" y="47" transform="rotate(-90)" class="pool-title" text-anchor="middle">
    MODELO DE GESTÃO E INCENTIVO PARA COLETA DE NOTAS FISCAIS
  </text>

  <!-- Divisórias das 4 Raias -->
  <line x1="64" y1="170" x2="1160" y2="170" stroke="#64748b" stroke-width="1.2" />
  <line x1="64" y1="370" x2="1160" y2="370" stroke="#64748b" stroke-width="1.2" />
  <line x1="64" y1="520" x2="1160" y2="520" stroke="#64748b" stroke-width="1.2" />

  <!-- Cabeçalhos das Raias -->
  <rect x="64" y="20" width="50" height="150" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
  <text x="-95" y="84" transform="rotate(-90)" class="lane-label" text-anchor="middle">Comunidade</text>
  <text x="-95" y="102" transform="rotate(-90)" class="lane-label" text-anchor="middle">Acadêmica</text>

  <rect x="64" y="170" width="50" height="200" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
  <text x="-270" y="84" transform="rotate(-90)" class="lane-label" text-anchor="middle">Funcionários</text>
  <text x="-270" y="102" transform="rotate(-90)" class="lane-label" text-anchor="middle">administrativos</text>

  <rect x="64" y="370" width="50" height="150" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
  <text x="-445" y="84" transform="rotate(-90)" class="lane-label" text-anchor="middle">Coordenação</text>
  <text x="-445" y="102" transform="rotate(-90)" class="lane-label" text-anchor="middle">de curso</text>

  <rect x="64" y="520" width="50" height="220" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
  <text x="-630" y="94" transform="rotate(-90)" class="lane-label" text-anchor="middle">APAE</text>

  <!-- ==================== ELEMENTOS ==================== -->
  <!-- Raia 1: Comunidade Acadêmica -->
  <circle cx="160" cy="85" r="16" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8" />
  <rect x="230" y="50" width="160" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />

  <!-- Raia 2: Funcionários administrativos -->
  <rect x="230" y="210" width="160" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
  <polygon points="480,223 502,245 480,267 458,245" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" />
  <rect x="570" y="210" width="145" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
  <rect x="780" y="210" width="160" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />

  <!-- Raia 3: Coordenação de curso -->
  <rect x="230" y="410" width="160" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
  <rect x="450" y="410" width="160" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />

  <!-- Raia 4: APAE -->
  <rect x="230" y="560" width="175" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
  <polygon points="500,578 522,600 500,622 478,600" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" />
  <rect x="595" y="560" width="185" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
  <rect x="855" y="560" width="160" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
  <circle cx="1095" cy="600" r="16" fill="#f8cecc" stroke="#b85450" stroke-width="3.5" />

  <!-- ==================== CONEXÕES ==================== -->
  <!-- Raia 1 -->
  <path d="M 176 85 L 230 85" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 310 120 L 310 210" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Raia 2 -->
  <path d="M 390 245 L 458 245" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 480 267 L 480 320 L 310 320 L 310 280" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 502 245 L 570 245" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 715 245 L 780 245" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 860 280 L 860 350 L 310 350 L 310 410" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Raia 3 -->
  <path d="M 390 445 L 450 445" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 530 480 L 530 505 L 317.5 505 L 317.5 560" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Raia 4 -->
  <path d="M 405 600 L 478 600" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 522 600 L 595 600" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 780 600 L 855 600" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 500 622 L 500 695 L 935 695 L 935 640" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 1015 600 L 1079 600" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== TEXTOS ==================== -->
  <!-- Raia 1 -->
  <text x="160" y="122" class="event-label">INÍCIO</text>
  <text x="310" y="75" class="task-title">Depositar notas</text>
  <text x="310" y="95" class="task-title">fiscais na urna</text>

  <!-- Raia 2 -->
  <text x="310" y="235" class="task-title">Verificar urna</text>
  <text x="310" y="255" class="task-title">semanalmente</text>

  <text x="480" y="196" class="gw-label">Contém nota</text>
  <text x="480" y="214" class="gw-label">fiscal?</text>
  <text x="395" y="311" class="cond-label" text-anchor="middle">Não</text>
  <text x="536" y="235" class="cond-label" text-anchor="middle">Sim</text>

  <text x="642.5" y="245" class="task-title">Coletar notas</text>

  <text x="860" y="227" class="task-title">Entregar as</text>
  <text x="860" y="245" class="task-title">notas à</text>
  <text x="860" y="263" class="task-title">coordenação</text>

  <!-- Raia 3 -->
  <text x="310" y="435" class="task-title">Receber as</text>
  <text x="310" y="455" class="task-title">Notas fiscais</text>

  <text x="530" y="435" class="task-title">Levar notas</text>
  <text x="530" y="455" class="task-title">para a APAE</text>

  <!-- Raia 4 -->
  <text x="317.5" y="573" class="task-title">Organizar</text>
  <text x="317.5" y="591" class="task-title">manualmente</text>
  <text x="317.5" y="609" class="task-title">as notas</text>
  <text x="317.5" y="627" class="task-title">(desamassar)</text>

  <text x="500" y="551" class="gw-label">Notas dentro dos</text>
  <text x="500" y="569" class="gw-label">parâmetros?</text>
  <text x="558" y="590" class="cond-label" text-anchor="middle">Sim</text>
  <text x="518" y="665" class="cond-label">Não</text>

  <text x="687.5" y="582" class="task-title">Inserir dados</text>
  <text x="687.5" y="600" class="task-title">manualmente no</text>
  <text x="687.5" y="618" class="task-title">sistema Nota Bem</text>

  <text x="935" y="582" class="task-title">Descartar</text>
  <text x="935" y="600" class="task-title">notas</text>
  <text x="935" y="618" class="task-title">fisicamente</text>

  <text x="1095" y="638" class="event-label">FIM</text>
</svg>

